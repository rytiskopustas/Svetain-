# Pagrindiniai svetainės nustatymai
title: Teatro mokytojų erdvė
description: >-
  Bendruomenė teatro mokytojams – naujienos, renginiai, metodinė medžiaga
  ir patirties dalijimasis.
lang: lt
locale: lt_LT
# Trumpas šūkis – rodomas pradžios puslapio pavadinime paieškoje
tagline: Bendruomenė teatro mokytojams
# Numatytasis paveikslėlis dalinantis nuoroda (turi sutapti su defaults žemiau)
socialinis_paveikslelis: /assets/images/socialinis.png

# Svetainės adresas (Cloudflare Pages). Įsigijus domeną, pakeiskite į "https://www.teatromokytojai.lt"
url: "https://teatromokytojai.pages.dev"
baseurl: ""

# Google Search Console patvirtinimas
webmaster_verifications:
  google: MeVjsAD-Dsdo4vkyNyRuyknp_CdCsQdbpwdtM3EMxVA

# Kontaktai (pakeiskite savais)
email: rytis.kopustas@gmail.com
# Kontaktų formos raktas iš https://web3forms.com (kol tuščias – rodomas el. pašto mygtukas)
web3forms_key: "809fe638-b518-4bfc-a38e-71c39b9aef19"

timezone: Europe/Vilnius
permalink: /naujienos/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  # Paveikslėlis, rodomas dalinantis nuoroda (Facebook, Messenger ir kt.)
  - scope:
      path: ""
    values:
      image: /assets/images/socialinis.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "istekliai"
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ruby-version
  - node_modules
